# nodogsplash 設定範例（適用於 OpenWrt）
# 路徑：/etc/nodogsplash/nodogsplash.conf
#
# 說明：
#   使用者連上 WiFi 後會被導向 Captive Portal 登入頁。
#   登入後取得 token，前端呼叫帳本 API /auth 驗證，
#   再透過 ndsctl auth <mac> 放行裝置。

GatewayInterface br-lan

# 帳本 API Captive Portal 頁面 URL
RedirectURL http://192.168.1.1:5000/portal

# 放行帳本 API 伺服器本身（讓未認證使用者可以訪問登入頁）
FirewallRuleSet preauthenticated-users {
    FirewallRule allow tcp port 5000
    FirewallRule allow tcp port 80
    FirewallRule allow tcp port 443
    FirewallRule allow udp port 53
}

FirewallRuleSet authenticated-users {
    FirewallRule allow all
}

FirewallRuleSet users-to-router {
    FirewallRule allow udp port 53
    FirewallRule allow tcp port 5000
}

# 認證後 hook（可呼叫 everywifi-auth.sh 取得 token）
BinAuth /etc/nodogsplash/binauth.sh
